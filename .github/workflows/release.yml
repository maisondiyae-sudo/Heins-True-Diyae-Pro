# Heins True Diyae Pro - automatic builds for Windows, macOS and Linux.
#
# * Try a build: Actions tab > "Build & Release" > "Run workflow" (leave "Publish" off).
#   The tests run and the four downloads are built; they appear at the bottom of the
#   run page as Artifacts (kept 14 days) so you can try them before publishing.
# * Publish: same, with "Publish a release" ticked. After the builds and the tests, the
#   release v<APP_VERSION> (htd/config.py) is created at that commit with the four
#   files. If that version is already released, the run stops at once: raise
#   APP_VERSION first.
# * Git users can also push a tag v<APP_VERSION>, or create a release with that tag in
#   the GitHub page: the files are then built and attached to that release.
#
# Downloads: HeinsTrueDiyaePro-<version>-Windows.zip
#            HeinsTrueDiyaePro-<version>-macOS-AppleSilicon.dmg
#            HeinsTrueDiyaePro-<version>-macOS-Intel.dmg
#            HeinsTrueDiyaePro-<version>-x86_64.AppImage
name: Build & Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release v<APP_VERSION> with the four files (off = test build, Artifacts only)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"        # PySide6 supports 3.11-3.13

jobs:
  # --------------------------------------------------------------------------
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        name: Read APP_VERSION (and check the tag)
        run: |
          VERSION=$(sed -n 's/^APP_VERSION *= *"\([^"]*\)".*/\1/p' htd/config.py)
          [ -n "$VERSION" ] || { echo "::error::APP_VERSION not found in htd/config.py"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $VERSION (expected v$VERSION)"
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released. Raise APP_VERSION in htd/config.py, then run again."
            exit 1
          fi
        env:
          PUBLISH: ${{ inputs.publish }}

  # --------------------------------------------------------------------------
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System packages (FFmpeg + ffprobe, PortAudio, Qt runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libportaudio2 \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Analog tolerance tests
        run: python tests/test_analog_tolerance.py
      - name: Render pool regressions
        if: success() || failure()
        run: python -m unittest discover -s tests -p "test_render_pool_regressions.py" -v
      - name: Metadata hygiene
        if: success() || failure()
        run: python tests/test_metadata_clean.py

  # --------------------------------------------------------------------------
  windows:
    name: Windows (.zip)
    needs: version
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Build (build_windows.bat)
        shell: cmd
        run: call build_windows.bat
      - name: Zip the app folder
        shell: pwsh
        run: |
          $zip = "dist\HeinsTrueDiyaePro-${{ needs.version.outputs.version }}-Windows.zip"
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=7 $zip .\dist\HeinsTrueDiyaePro | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          } else {
            Compress-Archive -Path .\dist\HeinsTrueDiyaePro -DestinationPath $zip -Force
          }
          Get-Item $zip | Format-Table Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: HeinsTrueDiyaePro-Windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  macos:
    name: macOS ${{ matrix.label }} (.dmg)
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Intel is best effort: numba / llvmlite (librosa) and recent numpy no longer publish
    # Intel Mac wheels. If that build fails, the release still goes out without it.
    continue-on-error: ${{ matrix.label == 'Intel' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15           # Apple Silicon (M1 and later)
            label: AppleSilicon
          - runner: macos-15-intel     # last Intel image offered by GitHub (until 2027)
            label: Intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Build (build_macos.sh -> .app + .dmg)
        env:
          PYTHON: python
          # Wheels only for the compiled packages: pip then picks the newest versions that
          # still ship for this Mac (on Intel: older numba / llvmlite / numpy / scipy)
          # instead of trying to compile them from source.
          PIP_ONLY_BINARY: numpy,scipy,numba,llvmlite,matplotlib,pillow,pyside6,pedalboard,soxr,soundfile,sounddevice
        run: bash build_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: HeinsTrueDiyaePro-macOS-${{ matrix.label }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  linux:
    name: Linux (.AppImage)
    needs: version
    runs-on: ubuntu-24.04
    # Built inside Ubuntu 22.04 (glibc 2.35): an AppImage runs on systems at least as
    # recent as the one it was built on, so an older base reaches more distributions.
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - name: System packages (Python 3.12, build tools, libraries to bundle)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git binutils file
          apt-get install -y software-properties-common gnupg gpg-agent   # for the PPA below
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y --no-install-recommends python3.12 python3.12-venv python3.12-dev \
            libportaudio2 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libxkbcommon0 \
            libegl1 libgl1 libglib2.0-0 libfontconfig1 libdbus-1-3 libx11-xcb1 libpulse0
      - uses: actions/checkout@v6
      - name: Build (build_linux.sh -> .AppImage)
        env:
          PYTHON: python3.12
        run: bash build_linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: HeinsTrueDiyaePro-Linux
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  release:
    name: Publish release
    if: github.ref_type == 'tag' || inputs.publish
    needs: [version, tests, windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - name: Create the release (or add the files to the one made for this tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -lh out
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release created by hand on the GitHub page for this tag: attach the files.
            gh release upload "$TAG" out/* --clobber
            echo "Files attached to the existing release $TAG"
          else
            sed "s/<version>/$VERSION/g" packaging/release-notes.md > notes.md
            gh release create "$TAG" out/* \
              --target "$GITHUB_SHA" \
              --title "Heins True Diyae Pro $VERSION" \
              --notes-file notes.md
            echo "Release $TAG published"
          fi
